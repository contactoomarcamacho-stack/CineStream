<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Viewer | Mi Catálogo</title>
    <style>
        :root {
            --primary: #e50914;
            --bg: #141414;
            --card-bg: #2f2f2f;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        #searchBar {
            background: rgba(0,0,0,0.6);
            border: 1px solid #666;
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            width: 250px;
            transition: width 0.3s;
        }

        #searchBar:focus {
            width: 350px;
            outline: none;
            border-color: var(--primary);
        }

        .container {
            padding: 20px 5%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
            position: relative;
        }

        .movie-card:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .movie-card img {
            width: 100%;
            height: 270px;
            object-fit: cover;
            display: block;
        }

        .movie-info {
            padding: 10px;
            font-size: 0.9rem;
        }

        .movie-info h3 {
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 1rem;
        }

        .rating {
            color: #46d369;
            font-weight: bold;
            margin-top: 5px;
            display: block;
        }

        /* Reproductor Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #000;
            width: 90%;
            max-width: 900px;
            border-radius: 8px;
            position: relative;
            padding: 20px;
        }

        .close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        .player-area {
            width: 100%;
            aspect-ratio: 16/9;
            background: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed #444;
        }

        .btn-play {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            #searchBar { width: 150px; }
            #searchBar:focus { width: 200px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">STREAM-FLIX</div>
        <input type="text" id="searchBar" placeholder="Buscar título...">
    </header>

    <div class="container">
        <div id="movieGrid" class="grid">
            </div>
    </div>

    <div id="playerModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle"></h2>
            <div class="player-area">
                <p id="streamLink">Preparando enlace de streaming...</p>
                <code id="debugInfo" style="color: #888;"></code>
                <button class="btn-play">INICIAR REPRODUCCIÓN</button>
            </div>
            <p id="modalMeta" style="color: #aaa; font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <script>
        let moviesData = [];

        // Cargar el archivo JSON
        async function fetchMovies() {
            try {
                const response = await fetch('player_api.json');
                moviesData = await response.json();
                renderMovies(moviesData);
            } catch (err) {
                console.error("Error cargando el JSON:", err);
                document.getElementById('movieGrid').innerHTML = "<h2>Error: No se encontró player_api.json</h2>";
            }
        }

        function renderMovies(list) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            
            list.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${movie.stream_icon}" alt="${movie.name}" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
                    <div class="movie-info">
                        <h3>${movie.name}</h3>
                        <span class="rating">⭐ ${movie.rating || 'N/A'}</span>
                    </div>
                `;
                card.onclick = () => openModal(movie);
                grid.appendChild(card);
            });
        }

        function openModal(movie) {
            const modal = document.getElementById('playerModal');
            document.getElementById('modalTitle').innerText = movie.name;
            document.getElementById('debugInfo').innerText = `ID: ${movie.stream_id} | Ext: ${movie.container_extension}`;
            document.getElementById('modalMeta').innerText = `Agregado: ${new Date(movie.added * 1000).toLocaleDateString()}`;
            
            modal.style.display = 'flex';
        }

        // Buscador
        document.getElementById('searchBar').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = moviesData.filter(m => m.name.toLowerCase().includes(query));
            renderMovies(filtered);
        });

        // Cerrar Modal
        document.querySelector('.close').onclick = () => {
            document.getElementById('playerModal').style.display = 'none';
        };

        window.onclick = (event) => {
            const modal = document.getElementById('playerModal');
            if (event.target == modal) modal.style.display = 'none';
        };

        // Iniciar
        fetchMovies();
    </script>
</body>
</html>
